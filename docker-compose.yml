name: whirm-backend

services:
  api:
    container_name: whirm-backend-api
    build: .
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      setup:
        condition: service_completed_successfully
    environment: &api_environment
      PORT: 3000
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-whirm_backend}
      POSTGRES_SSL: 'false'

  setup:
    container_name: whirm-backend-setup
    build:
      context: .
      target: builder
    restart: 'no'
    command: ['sh', '-c', 'pnpm db:migrate && pnpm db:seed']
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *api_environment
      NODE_ENV: development

  db:
    container_name: whirm-backend-db
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-whirm_backend}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
